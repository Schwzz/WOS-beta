name: Auralis checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install requests python-dotenv "textual>=8.2.8,<9"
      - run: python -m unittest discover -s tests -t .
      - run: node --check overlay/web/chat.js
      - run: node --check overlay/web/sage.js
      - run: node --check overlay/web/desktop.js
      - run: node tests/js/chat_harness.js
      - run: node tests/js/avatar_harness.js
      - run: node tests/js/desktop_harness.js
